name: Build EmuSuNi PS4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # If your team uses a specific Docker container containing the OpenOrbis SDK / PacBrew runtime, 
    # specify it here. Otherwise, you can install the toolchain in the steps below.
    container:
      image: ghcr.io/openorbis/ps4-toolchain:latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          echo "Setting up workspace directories..."
          mkdir -p $HOME/src
          # Link or place required source dependencies if they aren't submodules
          
      - name: Run Build Script
        run: |
          chmod +x scripts/*.sh
          # Execute the primary build script configured in CMakeLists.txt
          ./scripts/build.sh
          
      - name: Upload Eboot / PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emusuni-ps4-package
          path: |
            build/eboot.bin
            build/*.pkg
            build/emusuni.elf