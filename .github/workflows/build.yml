name: Build EmuSuNi PS4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (LLVM, Clang, LLD)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build git

      - name: Set up OpenOrbis Toolchain & Core Sources
        run: |
          echo "Setting up workspace directories..."
          mkdir -p $HOME/src
          
          # Clone required core repositories expected by CMakeLists.txt and build scripts
          if [ ! -d "$HOME/src/mupen64plus-next" ]; then
            git clone --depth 1 https://github.com/mupen64plus/mupen64plus-next.git $HOME/src/mupen64plus-next
          fi
          
          # If other optional or required core sources (like snes9x or fceumm) need cloning, add them here:
          # if [ ! -d "$HOME/src/snes9x" ]; then
          #   git clone --depth 1 https://github.com/snes9xemu/snes9x.git $HOME/src/snes9x
          # fi

      - name: Run Build Script
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh
          
      - name: Upload Eboot / PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emusuni-ps4-package
          path: |
            build/eboot.bin
            build/*.pkg
            build/emusuni.elf