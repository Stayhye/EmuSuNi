name: Build EmuSuNi PS4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (LLVM, Clang, LLD)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build

      - name: Set up OpenOrbis Toolchain environment
        run: |
          # Set up target directories and clone or configure OpenOrbis if necessary
          echo "Setting up workspace directories..."
          mkdir -p $HOME/src
          
          # If you manage OpenOrbis or PacBrew locally, configure paths here:
          # echo "OO_PS4_TOOLCHAIN=$HOME/openorbis" >> $GITHUB_ENV

      - name: Run Build Script
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh
          
      - name: Upload Eboot / PKG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emusuni-ps4-package
          path: |
            build/eboot.bin
            build/*.pkg
            build/emusuni.elf