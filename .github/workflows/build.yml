name: Build EmuSuNi PS4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EmuSuNi repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and host dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            wget curl git python3 zip cmake ninja-build \
            clang lld llvm glslang-tools

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 500M

      - name: Clone all required core and library dependencies
        run: |
          export GIT_TERMINAL_PROMPT=0
          mkdir -p $HOME/src
          mkdir -p $HOME/dolphinps4-build/src

          # 1. Snes9x (SNES)
          if [ ! -d "$HOME/src/snes9x/.git" ]; then
            git clone --depth 1 https://github.com/libretro/snes9x.git $HOME/src/snes9x
          fi

          # 2. FCEUmm (NES)
          if [ ! -d "$HOME/src/fceumm/.git" ]; then
            git clone --depth 1 https://github.com/libretro/libretro-fceumm.git $HOME/src/fceumm
          fi

          # 3. Dear ImGui (v1.92.2b)
          if [ ! -d "$HOME/src/imgui/.git" ]; then
            git clone --depth 1 -b v1.92.2b https://github.com/ocornut/imgui.git $HOME/src/imgui || \
            git clone --depth 1 https://github.com/ocornut/imgui.git $HOME/src/imgui
          fi

          # 4. Mupen64Plus-Next (N64)
          if [ ! -d "$HOME/src/mupen64plus-next/.git" ]; then
            git clone --depth 1 https://github.com/libretro/mupen64plus-libretro-nx.git $HOME/src/mupen64plus-next
          fi

          # 5. rcheevos (RetroAchievements v12.5.0)
          if [ ! -d "$HOME/src/rcheevos/.git" ]; then
            git clone --depth 1 -b v12.5.0 https://github.com/RetroAchievements/rcheevos.git $HOME/src/rcheevos || \
            git clone --depth 1 https://github.com/RetroAchievements/rcheevos.git $HOME/src/rcheevos
          fi

          # 6. libchdr
          if [ ! -d "$HOME/src/libchdr/.git" ]; then
            git clone --depth 1 https://github.com/rtissera/libchdr.git $HOME/src/libchdr
          fi

          # 7. Mesa / Vulkan headers (Hosted on GitLab)
          if [ ! -d "$HOME/dolphinps4-build/src/mesa/.git" ]; then
            git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git $HOME/dolphinps4-build/src/mesa
          fi

      - name: Setup OpenOrbis SDK Environment
        run: |
          export GIT_TERMINAL_PROMPT=0
          if [ ! -d "$HOME/openorbis/.git" ]; then
            git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/openorbis
          fi
          echo "OPENORBIS=$HOME/openorbis" >> $GITHUB_ENV

      - name: Run EmuSuNi Build Script
        run: |
          chmod +x scripts/*.sh
          export OPENORBIS=$HOME/openorbis
          export PATH="$OPENORBIS/bin:$PATH"
          export CC=clang
          export CXX=clang++
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          
          # Pass environment variables and run build script
          bash scripts/build.sh with-saturn with-gblink with-openbor

      - name: Package PKG File
        run: |
          if [ -f "scripts/package.sh" ]; then
            bash scripts/package.sh 00.23
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emusuni-ps4-build
          path: |
            out/*.pkg
            build/emusuni_eboot/eboot.bin
            build/emusuni.elf